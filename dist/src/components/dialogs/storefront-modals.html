<div class="storefront-modals-root">
  <div id="consultation-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="consult-title">
    <div class="modal-panel">
      <button class="modal-close" type="button" onclick="closeConsultation()" aria-label="Đóng"><i data-feather="x"></i></button>
      <div class="modal-content">
        <span class="modal-kicker">HỖ TRỢ CHỌN SẢN PHẨM</span>
        <h2 id="consult-title">Bạn đang quan tâm điều gì nhất?</h2>
        <p>Chọn một nhu cầu để lọc nhanh nhóm sản phẩm tham khảo.</p>
        <div class="consult-grid">
          <button class="consult-option" type="button" data-consult="treatment" data-label="Da dầu & mụn"><strong>Da dầu & mụn</strong><span>Dầu thừa, bít tắc, sau mụn</span></button>
          <button class="consult-option" type="button" data-consult="moisturizer" data-label="Khô & thiếu ẩm"><strong>Khô & thiếu ẩm</strong><span>Căng rát, bong tróc, thiếu nước</span></button>
          <button class="consult-option" type="button" data-consult="sunscreen" data-label="Sắc tố & lão hóa"><strong>Sắc tố & lão hóa</strong><span>Không đều màu, nếp nhăn</span></button>
        </div>
        <div id="consultation-result" class="recommendation hidden"></div>
        <div class="consent-box"><i data-feather="info"></i><span>Gợi ý chỉ mang tính tham khảo. Với tình trạng viêm hoặc kích ứng kéo dài, hãy gặp bác sĩ da liễu.</span></div>
        <button id="consultation-cta" class="btn btn--primary btn--full" type="button" disabled>Chọn một nhu cầu để tiếp tục</button>
      </div>
    </div>
  </div>
  <div id="policy-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="policy-title">
    <div class="modal-panel">
      <button class="modal-close" type="button" onclick="closePolicy()" aria-label="Đóng"><i data-feather="x"></i></button>
      <div id="policy-content" class="modal-content"></div>
    </div>
  </div>
</div>

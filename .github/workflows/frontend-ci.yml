name: SkinID CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: skinid-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:all
      - run: npm run check:worker
        env:
          CLOUDFLARE_SEND_METRICS: "false"

  deploy-pages:
    needs: test-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_API_BASE_URL: https://skinid-web-v2.fieldman-vn.workers.dev/api
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build

      - name: Prepare GitHub Pages bundle
        run: |
          cp favicon.png favicon-32.png dist/
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          ls -1 dist

      - name: Force Pages to publish the workflow artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api="https://api.github.com/repos/${{ github.repository }}/pages"
          current=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" "$api" \
            | grep -o '"build_type":"[^"]*"' | head -1)
          echo "current build_type: ${current:-unknown}"
          if [ "$current" = '"build_type":"workflow"' ]; then
            echo "already publishing the workflow artifact"
            exit 0
          fi
          echo "switching Pages source to GitHub Actions"
          code=$(curl -sS -o /tmp/pages-put.json -w '%{http_code}' \
            -X PUT "$api" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d '{"build_type":"workflow"}')
          echo "PUT -> $code"
          cat /tmp/pages-put.json | head -20
          if [ "$code" != "204" ] && [ "$code" != "200" ]; then
            echo "::error::Could not switch Pages source. Set Settings > Pages > Source to 'GitHub Actions'."
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

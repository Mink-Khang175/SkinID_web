name: SkinID CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: skinid-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:all
      - run: npm run check:worker
        env:
          CLOUDFLARE_SEND_METRICS: "false"

  deploy-pages:
    needs: test-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_API_BASE_URL: https://skinid-web-v2.fieldman-vn.workers.dev/api
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build

      - name: Prepare GitHub Pages bundle
        run: |
          cp favicon.png favicon-32.png dist/
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          ls -1 dist

      - name: Report current Pages source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            | grep -o '"build_type":"[^"]*"' | head -1)
          echo "Pages build_type: ${current:-unknown}"
          if [ "$current" != '"build_type":"workflow"' ]; then
            echo "::warning::Pages still uses branch publishing. Set Settings > Pages > Source = GitHub Actions."
          fi

      # GitHub still builds the raw repo root for every push while the site uses
      # branch publishing. That build serves the Vite dev shell (/src/main.jsx),
      # which browsers refuse because GitHub sends it as text/jsx. Waiting for it
      # to finish makes the artifact deployment below the last writer.
      - name: Let the legacy branch build finish first
        run: |
          sha='${{ github.sha }}'
          py='import sys,json; r=json.load(sys.stdin).get("workflow_runs",[]); l=[x for x in r if x["name"]=="pages build and deployment"]; print(l[0]["status"] if l else "absent")'
          for i in $(seq 1 45); do
            status=$(curl -sS "https://api.github.com/repos/${{ github.repository }}/actions/runs?head_sha=$sha&per_page=30" | python3 -c "$py")
            echo "attempt $i: legacy pages build = $status"
            if [ "$status" = "completed" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Legacy Pages build still running; deploying anyway."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
